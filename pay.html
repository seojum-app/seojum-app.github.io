<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>서줌 결제</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#F4F5FA;color:#141729;word-break:keep-all}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  h1{font-size:20px;margin:0 0 8px}
  p{font-size:14px;color:#5B6180;line-height:1.6;margin:0}
  .amt{font-size:26px;font-weight:800;color:#2234D4;margin:6px 0 2px}
  .spin{width:36px;height:36px;border:4px solid #E3E6FF;border-top-color:#2234D4;border-radius:50%;animation:s 1s linear infinite;margin-bottom:18px}
  @keyframes s{to{transform:rotate(360deg)}}
  button{margin-top:20px;border:0;background:#2234D4;color:#fff;font-weight:800;font-size:15px;border-radius:12px;padding:14px 22px}
</style>
<script src="https://pay.nicepay.co.kr/v1/js/"></script>
</head>
<body>
<div class="wrap">
  <div class="spin" id="spin"></div>
  <h1 id="title">결제 창을 여는 중입니다</h1>
  <div class="amt" id="amt"></div>
  <p id="desc">잠시만 기다려 주세요.</p>
  <p id="law" style="margin-top:14px;font-size:12.5px;max-width:360px">서주미가 현장에서 대기를 시작하면(명단 작성은 작성을 마치면) 서비스가 시작된 것이라 취소·환불(청약철회)이 제한돼요. 그 뒤 교대 시각에 오지 않아도 대행비는 환불되지 않아요. 이용 전 취소·서주미 미도착은 전액 환불돼요. <a href="https://seojum.kr/index.html#refund" style="color:#2234D4">환불 안내</a></p>
  <button id="retry" hidden>다시 시도</button>
</div>
<script>
// 서줌 앱 전용 결제 페이지 — 11/24 나이스페이 포스타트 (Server 승인)
// 앱이 ?id=seojum-pay-…&amount=…&name=… 로 열면 나이스페이 결제창을 띄웁니다.
// 인증이 끝나면 나이스페이가 서버 함수(card-payment ?op=return)로 결과를 보내고, 서버가 서명·금액·의뢰 상태를
// 확인한 뒤 승인합니다. 서버는 이 페이지(?paymentId=…)로 돌려보내고, 이 페이지가 결과를 앱에 전달합니다.
// 클라이언트 키는 공개용 값입니다. (시크릿 키는 서버 함수에만 있습니다)
//   테스트(샌드박스): S2_…  /  운영: R2_…  — 서버 함수의 NICEPAY_MODE와 반드시 같은 쪽을 쓸 것
var CLIENT_ID = 'S2_8b7d87b3666b46079e6813a2db47da36';
// var CLIENT_ID = 'R2_3773c69f8bac483db9dafdc2572e8a5e'; // 운영 전환 시
var RETURN_URL = 'https://gtvbqzsqzhlwmtlslzko.supabase.co/functions/v1/card-payment?op=return';

var q = new URLSearchParams(location.search);
function send(result) { if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(result)); }
function show(title, desc, retry) {
  document.getElementById('spin').hidden = true;
  if (q.has('paymentId')) document.getElementById('law').hidden = true;
  document.getElementById('title').textContent = title;
  document.getElementById('desc').textContent = desc;
  document.getElementById('retry').hidden = !retry;
}
function done(id, code, message) {
  if (code) {
    show('결제를 완료하지 못했습니다', message || '다시 시도해 주세요.', false);
    send({ ok: false, id: id, message: message || '결제가 취소되었습니다.' });
  } else {
    show('결제가 끝났습니다', '앱으로 돌아가 결제를 확인합니다.', false);
    send({ ok: true, id: id });
  }
}

// 서버 승인 후 돌아옴 (?paymentId=...&code=...&message=...)
if (q.has('paymentId')) {
  done(q.get('paymentId'), q.get('code'), q.get('message'));
} else {
  var id = q.get('id') || '';
  var amount = parseInt(q.get('amount') || '0', 10);
  var name = (q.get('name') || '서줌 대행비').replace(/["¦]/g, '-').slice(0, 13); // 상품명 40바이트(한글 약 13자)
  if (!/^seojum-pay-[0-9a-f]{32}$/.test(id) || !(amount > 0)) {
    show('잘못된 접근입니다', '서줌 앱에서 결제를 진행해 주세요.', false);
  } else {
    document.getElementById('amt').textContent = amount.toLocaleString('ko-KR') + '원';
    var start = function () {
      try {
        AUTHNICE.requestPay({
          clientId: CLIENT_ID,
          method: 'card',
          orderId: id,
          amount: amount,
          goodsName: name,
          returnUrl: RETURN_URL,
          fnError: function (r) {
            var m = (r && (r.errorMsg || r.msg)) || '결제 창을 열지 못했습니다.';
            show('결제를 완료하지 못했습니다', m, true);
            send({ ok: false, id: id, message: m });
          }
        });
      } catch (e) {
        show('결제 창을 열지 못했습니다', String(e && e.message || e), true);
        send({ ok: false, id: id, message: '결제 창을 열지 못했습니다.' });
      }
    };
    document.getElementById('retry').onclick = function () { document.getElementById('retry').hidden = true; start(); };
    start();
  }
}
</script>
</body>
</html>
